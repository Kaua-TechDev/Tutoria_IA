[project]
name = "tutoria-ia"
version = "1.0.0"
description = "Tutor educacional com IA generativa, gamificação e painel para responsáveis"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# E221: alinhamento das colunas dos models; E501: o prompt e os dados de
# demonstração têm linhas longas de propósito; S101: assert nos testes.
ignore = ["E221", "E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"db/init_db.py" = ["E402", "S106"]
"tests/*" = ["S105", "S106"]
